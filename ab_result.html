<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A/B Test Results - Conversion Rate by Group</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            padding: 40px;
            max-width: 600px;
            width: 100%;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 8px;
            color: #1f2937;
        }

        .subtitle {
            font-size: 14px;
            color: #6b7280;
            margin-bottom: 32px;
        }

        .chart-wrapper {
            position: relative;
            height: 400px;
            margin-bottom: 32px;
        }

        svg {
            width: 100%;
            height: 100%;
        }

        .bar-group {
            cursor: pointer;
        }

        .bar {
            transition: opacity 0.2s ease;
        }

        .bar-group:hover .bar {
            opacity: 0.8;
        }

        .tooltip {
            position: absolute;
            background: rgba(31, 41, 55, 0.95);
            color: white;
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 13px;
            pointer-events: none;
            white-space: nowrap;
            display: none;
            z-index: 10;
        }

        .tooltip.visible {
            display: block;
        }

        .stats-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 24px;
        }

        .stats-table th {
            background: #f3f4f6;
            padding: 12px;
            text-align: left;
            font-size: 13px;
            font-weight: 600;
            color: #374151;
            border-bottom: 1px solid #e5e7eb;
        }

        .stats-table td {
            padding: 12px;
            border-bottom: 1px solid #e5e7eb;
            font-size: 14px;
        }

        .stats-table tr:hover {
            background: #f9fafb;
        }

        .group-label {
            font-weight: 600;
            color: #1f2937;
        }

        .numeric {
            text-align: right;
            font-variant-numeric: tabular-nums;
        }

        .diff-highlight {
            background: #fef3c7;
            padding: 2px 4px;
            border-radius: 2px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>A/B Test Results</h1>
        <p class="subtitle">Conversion Rate by Group</p>

        <div class="chart-wrapper">
            <svg viewBox="0 0 500 350" preserveAspectRatio="xMidYMid meet">
                <!-- Background -->
                <rect width="500" height="350" fill="white"/>

                <!-- Grid lines -->
                <line x1="60" y1="280" x2="480" y2="280" stroke="#e5e7eb" stroke-width="1"/>
                <line x1="60" y1="210" x2="480" y2="210" stroke="#e5e7eb" stroke-width="1"/>
                <line x1="60" y1="140" x2="480" y2="140" stroke="#e5e7eb" stroke-width="1"/>
                <line x1="60" y1="70" x2="480" y2="70" stroke="#e5e7eb" stroke-width="1"/>

                <!-- Axes -->
                <line x1="60" y1="50" x2="60" y2="290" stroke="#374151" stroke-width="2"/>
                <line x1="60" y1="290" x2="480" y2="290" stroke="#374151" stroke-width="2"/>

                <!-- Y-axis labels -->
                <text x="45" y="295" text-anchor="end" font-size="12" fill="#6b7280">0%</text>
                <text x="45" y="215" text-anchor="end" font-size="12" fill="#6b7280">5%</text>
                <text x="45" y="145" text-anchor="end" font-size="12" fill="#6b7280">10%</text>

                <!-- Y-axis title -->
                <text x="15" y="170" font-size="13" font-weight="600" fill="#374151" text-anchor="middle" transform="rotate(-90 15 170)">Conversion Rate (%)</text>

                <!-- Group A Bar -->
                <g class="bar-group" data-group="A" data-rate="7.07" data-visitors="3976" data-purchases="281">
                    <rect class="bar" x="140" y="140" width="80" height="150" fill="#3b82f6" rx="4" ry="4"/>
                    <!-- Visitor count label on bar -->
                    <text x="180" y="280" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2937">3,976</text>
                    <!-- Conversion rate label on bar -->
                    <text x="180" y="130" text-anchor="middle" font-size="14" font-weight="700" fill="white">7.07%</text>
                </g>

                <!-- Group B Bar -->
                <g class="bar-group" data-group="B" data-rate="9.87" data-visitors="4024" data-purchases="397">
                    <rect class="bar" x="280" y="95" width="80" height="195" fill="#10b981" rx="4" ry="4"/>
                    <!-- Visitor count label on bar -->
                    <text x="320" y="310" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2937">4,024</text>
                    <!-- Conversion rate label on bar -->
                    <text x="320" y="155" text-anchor="middle" font-size="14" font-weight="700" fill="white">9.87%</text>
                </g>

                <!-- X-axis labels -->
                <text x="180" y="320" text-anchor="middle" font-size="13" font-weight="600" fill="#374151">Group A</text>
                <text x="320" y="320" text-anchor="middle" font-size="13" font-weight="600" fill="#374151">Group B</text>

                <!-- X-axis title -->
                <text x="270" y="345" text-anchor="middle" font-size="13" font-weight="600" fill="#374151">Test Variant</text>
            </svg>
            <div class="tooltip" id="tooltip"></div>
        </div>

        <table class="stats-table">
            <thead>
                <tr>
                    <th>Group</th>
                    <th class="numeric">Visitors</th>
                    <th class="numeric">Purchases</th>
                    <th class="numeric">Conversion Rate</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td class="group-label">A (Control)</td>
                    <td class="numeric">3,976</td>
                    <td class="numeric">281</td>
                    <td class="numeric">7.07%</td>
                </tr>
                <tr>
                    <td class="group-label">B (Variant)</td>
                    <td class="numeric">4,024</td>
                    <td class="numeric">397</td>
                    <td class="numeric">9.87%</td>
                </tr>
                <tr style="background: #f0fdf4;">
                    <td class="group-label">Difference</td>
                    <td class="numeric">—</td>
                    <td class="numeric">+116</td>
                    <td class="numeric"><span class="diff-highlight">+2.80pp (39.6%)</span></td>
                </tr>
            </tbody>
        </table>
    </div>

    <script>
        // Tooltip functionality
        const barGroups = document.querySelectorAll('.bar-group');
        const tooltip = document.getElementById('tooltip');
        const chartWrapper = document.querySelector('.chart-wrapper');

        barGroups.forEach(group => {
            group.addEventListener('mouseenter', (e) => {
                const groupName = group.dataset.group;
                const rate = group.dataset.rate;
                const visitors = parseInt(group.dataset.visitors).toLocaleString();
                const purchases = group.dataset.purchases;

                tooltip.innerHTML = `Group ${groupName}: ${rate}% conversion<br>${purchases}/${visitors} visitors`;
                tooltip.classList.add('visible');
            });

            group.addEventListener('mousemove', (e) => {
                const rect = chartWrapper.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top - 40;

                tooltip.style.left = x + 'px';
                tooltip.style.top = y + 'px';
            });

            group.addEventListener('mouseleave', () => {
                tooltip.classList.remove('visible');
            });
        });
    </script>
</body>
</html>
